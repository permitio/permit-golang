repos:
  - repo: local
    hooks:
      - id: go-mod-tidy
        entry: go mod tidy -diff
        language: system
      - id: go-mod-tidy-tools
        entry: go -C tools mod tidy -diff
        language: system
      - id: go-vet
        entry: go vet ./...
        language: system
  - repo: https://example.com/hooks
    rev: 0123456789abcdef0123456789abcdef01234567  # frozen: v1.0.0
    hooks:
      - id: lint
