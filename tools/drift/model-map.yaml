# The drift map of package models, and of the decision types of the root package that the
# requests to the PDP and its replies hold. tools/drift checks it against the types and the spec
# snapshots in tools/specs, and apisurface reads its required flags to find a field that turned
# required. The section Model drift of CONTRIBUTING.md says how to write a row.
#
# models.<Type>: a type that a schema of a spec describes, of package models or of the root
#   package.
#   spec: the snapshot that holds the schema: control-plane (when left out), pdp-container or
#     pdp-cloud.
#   schema: the name of the schema under components.schemas.
#   also: the schemas of other specs that describe the type too, each {spec, schema} of a spec of
#     its own, such as the schema of the cloud PDP of a decision type. The type is compared with
#     each; the keys of the findings name the type and the spec, such as User@pdp-cloud.
#   left_out.<property>: a property of the schemas that the type has no field for on purpose,
#     with the reason. The round trip leaves it out of the maximal values; the comparison still
#     finds it, for allow.yaml to accept.
#   fields.<JSON name>: each field of a struct.
#     required: true when the schema lists the field as required.
#     null_policy: what the API does with null for the field in a request: accepts (the field
#       is a models.Optional), rejects, ignores (the API reads null as the field left out), or
#       n/a, for a type that no request holds.
#
# blocks.<Type>: a type that no schema describes, which models use for their fields, with what it
# stands for.
models:
  # An API key, as a create sends it and as the API returns it. A create reads null for a field
  # that the schema does not require and that has no default as the field left out, as every
  # create does, and rejects null for the organization and for the fields with a default: the
  # level, the access level and the owner type. These null policies are not measured yet: the
  # phase api.api_keys of the local harness confirms them. The model of the reply leaves out the
  # member who created the key.
  APIKeyCreate:
    schema: APIKeyCreate
    fields:
      organization_id: {required: true, null_policy: rejects}
      project_id: {required: false, null_policy: ignores}
      environment_id: {required: false, null_policy: ignores}
      object_type: {required: false, null_policy: rejects}
      access_level: {required: false, null_policy: rejects}
      owner_type: {required: false, null_policy: rejects}
      name: {required: false, null_policy: ignores}
  APIKeyOwnerType:
    schema: APIKeyOwnerType
  APIKeyRead:
    schema: APIKeyRead
    left_out:
      created_by_member: >-
        the member of the organization who created the key, which the SDK does not model, as
        the members of the organization are account administration that it does not cover, and
        the invite of a member holds its invite code
    fields:
      organization_id: {required: true, null_policy: n/a}
      project_id: {required: false, null_policy: n/a}
      environment_id: {required: false, null_policy: n/a}
      object_type: {required: false, null_policy: n/a}
      access_level: {required: false, null_policy: n/a}
      owner_type: {required: true, null_policy: n/a}
      name: {required: false, null_policy: n/a}
      id: {required: true, null_policy: n/a}
      secret: {required: false, null_policy: n/a}
      created_at: {required: true, null_policy: n/a}
      last_used_at: {required: false, null_policy: n/a}
      env: {required: false, null_policy: n/a}
      project: {required: false, null_policy: n/a}
  APIKeyScopeRead:
    schema: APIKeyScopeRead
    fields:
      organization_id: {required: true, null_policy: n/a}
      project_id: {required: false, null_policy: n/a}
      environment_id: {required: false, null_policy: n/a}
  AttributeType:
    schema: AttributeType
  # The decision types of the root package map to the schemas of the PDP container, and to those
  # of the cloud PDP. Both PDPs read null for an optional string of a check, and for a filter of
  # the permissions of a user, a list, as the field left out (the spec of the cloud PDP types
  # these fields as a value or null), and both answer 422 to null for a map. The types of the
  # replies are in no request.
  AuthorizedUserAssignment:
    spec: pdp-container
    schema: AuthorizedUserAssignment
    also:
      - {spec: pdp-cloud, schema: AuthorizedUserAssignment}
    fields:
      user: {required: true, null_policy: n/a}
      tenant: {required: true, null_policy: n/a}
      resource: {required: true, null_policy: n/a}
      role: {required: true, null_policy: n/a}
  AuthorizedUsersRequest:
    spec: pdp-container
    schema: AuthorizedUsersAuthorizationQuery
    also:
      - {spec: pdp-cloud, schema: AuthorizedUsersQuery}
    left_out:
      sdk: >-
        the PDP reads the language of the SDK from the X-Permit-SDK-Language header, which every
        request of the SDK carries
    fields:
      action: {required: true, null_policy: rejects}
      resource: {required: true, null_policy: rejects}
      context: {required: false, null_policy: rejects}
  AuthorizedUsersResult:
    spec: pdp-container
    schema: AuthorizedUsersResult
    also:
      - {spec: pdp-cloud, schema: AuthorizedUsersResult}
    fields:
      resource: {required: true, null_policy: n/a}
      tenant: {required: true, null_policy: n/a}
      users: {required: true, null_policy: n/a}
  CheckRequest:
    spec: pdp-container
    schema: AuthorizationQuery
    also:
      - {spec: pdp-cloud, schema: AllowedQuery}
    left_out:
      sdk: >-
        the PDP reads the language of the SDK from the X-Permit-SDK-Language header, which every
        request of the SDK carries
    fields:
      user: {required: true, null_policy: rejects}
      action: {required: true, null_policy: rejects}
      resource: {required: true, null_policy: rejects}
      context: {required: false, null_policy: rejects}
  # The requests of the routes that only the PDP container serves map to the schemas of the PDP
  # container alone: the spec of the cloud PDP does not list the routes, as the cloud PDP does not
  # serve them, so these rows have no also.
  CheckURLRequest:
    spec: pdp-container
    schema: UrlAuthorizationQuery
    left_out:
      sdk: >-
        the PDP reads the language of the SDK from the X-Permit-SDK-Language header, which every
        request of the SDK carries
    fields:
      user: {required: true, null_policy: rejects}
      http_method: {required: true, null_policy: rejects}
      url: {required: true, null_policy: rejects}
      tenant: {required: true, null_policy: rejects}
      context: {required: false, null_policy: rejects}
  # A copy of an environment into another, with EnvironmentsService.Copy and CopyAsync. The API
  # rejects null for the target and for each field with a default: the conflict strategy, the
  # scope, each filter of the scope and each list of a filter; and reads null for the existing or
  # the new environment of the target, which have no default, as the field left out. These null
  # policies are not measured yet: the phase api.environments of the local harness confirms them.
  EnvironmentCopy:
    schema: EnvironmentCopy
    fields:
      target_env: {required: true, null_policy: rejects}
      conflict_strategy: {required: false, null_policy: rejects}
      scope: {required: false, null_policy: rejects}
  EnvironmentCopyConflictStrategy:
    schema: EnvironmentCopyConflictStrategy
  EnvironmentCopyScope:
    schema: EnvironmentCopyScope
    fields:
      resources: {required: false, null_policy: rejects}
      roles: {required: false, null_policy: rejects}
      user_sets: {required: false, null_policy: rejects}
      resource_sets: {required: false, null_policy: rejects}
      custom_policies: {required: false, null_policy: rejects}
  EnvironmentCopyScopeFilters:
    schema: EnvironmentCopyScopeFilters
    fields:
      include: {required: false, null_policy: rejects}
      exclude: {required: false, null_policy: rejects}
  EnvironmentCopyTarget:
    schema: EnvironmentCopyTarget
    fields:
      existing: {required: false, null_policy: ignores}
      new: {required: false, null_policy: ignores}
  # An environment to create, with EnvironmentsService.Create or as a new project holds it in
  # initial_environments, with the configuration of its JSON Web Key Sets. As in every create,
  # the API reads null for a field that the schema does not require as the field left out, and
  # rejects null for a required one. These null policies, like those of the projects below, are
  # not measured yet: the phases api.environments and api.projects of the local harness confirm
  # them.
  EnvironmentCreate:
    schema: EnvironmentCreate
    fields:
      key: {required: true, null_policy: rejects}
      name: {required: true, null_policy: rejects}
      description: {required: false, null_policy: ignores}
      custom_branch_name: {required: false, null_policy: ignores}
      jwks: {required: false, null_policy: ignores}
      settings: {required: false, null_policy: ignores}
  # An environment, as a create and an update return it, and with its email configuration as a
  # list and a get return it; the second embeds the first.
  EnvironmentRead:
    schema: EnvironmentRead
    fields:
      key: {required: true, null_policy: n/a}
      id: {required: true, null_policy: n/a}
      organization_id: {required: true, null_policy: n/a}
      project_id: {required: true, null_policy: n/a}
      created_at: {required: true, null_policy: n/a}
      updated_at: {required: true, null_policy: n/a}
      avp_policy_store_id: {required: false, null_policy: n/a}
      name: {required: true, null_policy: n/a}
      description: {required: false, null_policy: n/a}
      custom_branch_name: {required: false, null_policy: n/a}
      jwks: {required: false, null_policy: n/a}
      jwks_unpinned: {required: false, null_policy: n/a}
      settings: {required: false, null_policy: n/a}
  EnvironmentReadWithEmailConfig:
    schema: EnvironmentReadWithEmailConfig
    fields:
      key: {required: true, null_policy: n/a}
      id: {required: true, null_policy: n/a}
      organization_id: {required: true, null_policy: n/a}
      project_id: {required: true, null_policy: n/a}
      created_at: {required: true, null_policy: n/a}
      updated_at: {required: true, null_policy: n/a}
      avp_policy_store_id: {required: false, null_policy: n/a}
      name: {required: true, null_policy: n/a}
      description: {required: false, null_policy: n/a}
      custom_branch_name: {required: false, null_policy: n/a}
      jwks: {required: false, null_policy: n/a}
      jwks_unpinned: {required: false, null_policy: n/a}
      settings: {required: false, null_policy: n/a}
      email_configuration: {required: true, null_policy: n/a}
  # The statistics of an environment, which embed the environment as EnvironmentRead with the
  # configurations of its PDPs, whose credentials are each a Secret. The statistics leave out the
  # members of the organization that the reply lists.
  EnvironmentStatistics:
    schema: EnvironmentStatistics
    left_out:
      members: >-
        the members of the organization, which the SDK does not model, as the members of the
        organization are account administration that it does not cover
    fields:
      roles: {required: true, null_policy: n/a}
      users: {required: true, null_policy: n/a}
      policies: {required: true, null_policy: n/a}
      resources: {required: true, null_policy: n/a}
      tenants: {required: true, null_policy: n/a}
      has_decision_logs: {required: true, null_policy: n/a}
      mau: {required: true, null_policy: n/a}
  EnvironmentStats:
    schema: EnvironmentStats
    fields:
      key: {required: true, null_policy: n/a}
      id: {required: true, null_policy: n/a}
      organization_id: {required: true, null_policy: n/a}
      project_id: {required: true, null_policy: n/a}
      created_at: {required: true, null_policy: n/a}
      updated_at: {required: true, null_policy: n/a}
      avp_policy_store_id: {required: false, null_policy: n/a}
      name: {required: true, null_policy: n/a}
      description: {required: false, null_policy: n/a}
      custom_branch_name: {required: false, null_policy: n/a}
      jwks: {required: false, null_policy: n/a}
      jwks_unpinned: {required: false, null_policy: n/a}
      settings: {required: false, null_policy: n/a}
      pdp_configs: {required: true, null_policy: n/a}
      stats: {required: true, null_policy: n/a}
  # A change to an environment. An update stores null for the description, the branch name, the
  # configuration of the JSON Web Key Sets and the settings, which clears each, and rejects null
  # for the name, which only a value changes. These null policies are not measured yet: the phase
  # api.environments of the local harness confirms them.
  EnvironmentUpdate:
    schema: EnvironmentUpdate
    fields:
      name: {required: false, null_policy: rejects}
      description: {required: false, null_policy: accepts}
      custom_branch_name: {required: false, null_policy: accepts}
      jwks: {required: false, null_policy: accepts}
      settings: {required: false, null_policy: accepts}
  ErrorCode:
    schema: ErrorCode
  # An error of the API that a reply holds as a value, such as the error that ended a task.
  ErrorDetails:
    schema: ErrorDetails
    fields:
      id: {required: true, null_policy: n/a}
      title: {required: true, null_policy: n/a}
      error_code: {required: true, null_policy: n/a}
      message: {required: false, null_policy: n/a}
      support_link: {required: false, null_policy: n/a}
      additional_info: {required: false, null_policy: n/a}
  JwksConfig:
    schema: JwksConfig
    fields:
      audience: {required: false, null_policy: ignores}
      issuer: {required: false, null_policy: ignores}
      jwks: {required: false, null_policy: ignores}
      ttl: {required: false, null_policy: ignores}
      url: {required: false, null_policy: ignores}
  JwksObj:
    schema: JwksObj
    fields:
      keys: {required: true, null_policy: rejects}
  # A role assignment that the PDP container holds, an item of the reply of its list, which only
  # the container serves, so the row has no also.
  LocalRoleAssignment:
    spec: pdp-container
    schema: RoleAssignment
    fields:
      user: {required: true, null_policy: n/a}
      role: {required: true, null_policy: n/a}
      tenant: {required: true, null_policy: n/a}
      resource_instance: {required: false, null_policy: n/a}
  MemberAccessLevel:
    schema: MemberAccessLevel
  MemberAccessObj:
    schema: MemberAccessObj
  ObjectPermissions:
    spec: pdp-container
    schema: _UserPermissionsResult
    also:
      - {spec: pdp-cloud, schema: UserPermissionsResult}
    fields:
      tenant: {required: false, null_policy: n/a}
      resource: {required: false, null_policy: n/a}
      permissions: {required: true, null_policy: n/a}
      roles: {required: false, null_policy: n/a}
  # The configuration of a PDP of an environment, as the statistics of the environment hold it.
  PDPConfigRead:
    schema: PDPConfigRead
    fields:
      id: {required: true, null_policy: n/a}
      name: {required: false, null_policy: n/a}
      organization_id: {required: true, null_policy: n/a}
      project_id: {required: true, null_policy: n/a}
      environment_id: {required: true, null_policy: n/a}
      client_secret: {required: true, null_policy: n/a}
      debug_audit_logs: {required: false, null_policy: n/a}
      min_pdp_version: {required: false, null_policy: n/a}
      num_shards: {required: false, null_policy: n/a}
      opal_server_access_token: {required: false, null_policy: n/a}
  # A project, as a create sends it, as an update sends it and as the API returns it. A create
  # reads null for a field that the schema does not require as the field left out, as every
  # create does, but for initial_environments, a list with a default, whose null it rejects. An
  # update stores null for the description, which clears it, and rejects null for the name, the
  # settings and the policy repository, which only a value changes. These null policies are not
  # measured yet: the phase api.projects of the local harness confirms them.
  ProjectCreate:
    schema: ProjectCreate
    fields:
      key: {required: true, null_policy: rejects}
      urn_namespace: {required: false, null_policy: ignores}
      name: {required: true, null_policy: rejects}
      description: {required: false, null_policy: ignores}
      settings: {required: false, null_policy: ignores}
      active_policy_repo_id: {required: false, null_policy: ignores}
      initial_environments: {required: false, null_policy: rejects}
  ProjectRead:
    schema: ProjectRead
    fields:
      key: {required: true, null_policy: n/a}
      urn_namespace: {required: false, null_policy: n/a}
      id: {required: true, null_policy: n/a}
      organization_id: {required: true, null_policy: n/a}
      created_at: {required: true, null_policy: n/a}
      updated_at: {required: true, null_policy: n/a}
      name: {required: true, null_policy: n/a}
      description: {required: false, null_policy: n/a}
      settings: {required: false, null_policy: n/a}
      active_policy_repo_id: {required: false, null_policy: n/a}
  ProjectUpdate:
    schema: ProjectUpdate
    fields:
      name: {required: false, null_policy: rejects}
      description: {required: false, null_policy: accepts}
      settings: {required: false, null_policy: rejects}
      active_policy_repo_id: {required: false, null_policy: rejects}
  Resource:
    spec: pdp-container
    schema: Resource
    also:
      - {spec: pdp-cloud, schema: Resource}
    fields:
      type: {required: true, null_policy: rejects}
      key: {required: false, null_policy: ignores}
      tenant: {required: false, null_policy: ignores}
      attributes: {required: false, null_policy: rejects}
      context: {required: false, null_policy: rejects}
  ResourceDetails:
    spec: pdp-container
    schema: _ResourceDetails
    also:
      - {spec: pdp-cloud, schema: ResourceDetails}
    fields:
      type: {required: true, null_policy: n/a}
      key: {required: true, null_policy: n/a}
      attributes: {required: false, null_policy: n/a}
  # The task of a copy of an environment that runs in the background, as the copy and the result
  # of its task return it.
  TaskResultEnvironmentRead:
    schema: TaskResult_EnvironmentRead_
    fields:
      task_id: {required: true, null_policy: n/a}
      status: {required: true, null_policy: n/a}
      result: {required: false, null_policy: n/a}
      error: {required: false, null_policy: n/a}
  TaskStatus:
    schema: TaskStatus
  TenantDetails:
    spec: pdp-container
    schema: _TenantDetails
    also:
      - {spec: pdp-cloud, schema: TenantDetails}
    fields:
      key: {required: true, null_policy: n/a}
      attributes: {required: false, null_policy: n/a}
  User:
    spec: pdp-container
    schema: User
    also:
      - {spec: pdp-cloud, schema: User}
    left_out:
      firstName: >-
        the SDK sends first_name, which every PDP reads; the PDP container also reads firstName
      lastName: >-
        the SDK sends last_name, which every PDP reads; the PDP container also reads lastName
    fields:
      key: {required: true, null_policy: rejects}
      first_name: {required: false, null_policy: ignores}
      last_name: {required: false, null_policy: ignores}
      email: {required: false, null_policy: ignores}
      attributes: {required: false, null_policy: rejects}
  UserPermissionsRequest:
    spec: pdp-container
    schema: UserPermissionsQuery
    also:
      - {spec: pdp-cloud, schema: UserPermissionsQuery}
    fields:
      user: {required: true, null_policy: rejects}
      tenants: {required: false, null_policy: ignores}
      resources: {required: false, null_policy: ignores}
      resource_types: {required: false, null_policy: ignores}
      context: {required: false, null_policy: rejects}
  UserTenantsRequest:
    spec: pdp-container
    schema: UserTenantsQuery
    fields:
      user: {required: true, null_policy: rejects}
      context: {required: false, null_policy: rejects}
blocks:
  Attributes: a JSON object of any values, the schema of an object that lists no property
  Optional: a field that the API accepts null for, whose null policy is accepts
  Secret: >-
    a credential that the API returns, the schema of a string, which encodes as the marker of
    package redact in place of the credential
  StringOrList: >-
    one string or a list of strings, in the form that it was made or decoded in, the schema of
    anyOf a string and an array of strings
  Time: a timestamp, the schema of a string of format date-time
