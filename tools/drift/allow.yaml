# The drift findings that tools/drift accepts, each because the published spec differs from what
# the API does, and the SDK follows the API, because the spec lists an optional property that the
# API reads elsewhere, and the SDK leaves it out, because a reply fixture holds a value of an
# enum that the spec does not list, as the API may add one later, to check that the SDK reads
# it, because the SDK reads a property whose anyOf lists several forms into one Go type, with
# a reason that names what the type keeps and what it drops, or because an operation sends no
# JSON request body that the spec gives it, or reads no model of package models from a reply in
# 200-299 with a JSON body, such as a reply without fields, with a reason that says why. The
# section Model drift of CONTRIBUTING.md says when to add an entry.
#
# key: the key of the finding, as the failing test prints it before the colon, such as
#   "model UserRead field email", "operation get_user response",
#   "operation bulk_create_users response without model" or "reply get_user.200.json#/email".
#   An operation that names no model for a body has a finding under a key of its own, which ends
#   in "without model", so that its entry accepts no model that the operation names later.
# reason: why the finding is accepted, such as what the API does that the spec does not say
#   ("the API returns email, which the published spec does not list"), or why the SDK reads no
#   model from a reply.
# trigger: when the entry can go, such as "when the published spec lists email".
#
# An entry that accepts no finding fails as stale: remove it.
allow:
  - key: model APIKeyRead field created_by_member
    reason: >-
      the reply of an API key can hold the member of the organization who created it, which
      APIKeyRead leaves out, as the SDK covers no account administration of the members of the
      organization, and the invite of a member holds its invite code
    trigger: when the SDK models the members of the organization
  - key: model EnvironmentStatistics field members
    reason: >-
      the statistics of an environment list the members of the organization, which
      EnvironmentStatistics leaves out, as the SDK covers no account administration of the
      members of the organization
    trigger: when the SDK models the members of the organization
  - key: reply get_api_key_scope.200.organization-null.json#/project_id
    reason: >-
      the API answers the scope of an organization-level API key with project_id null, which the
      published spec types as a string only
    trigger: when the published spec allows null for project_id of APIKeyScopeRead
  - key: reply get_api_key_scope.200.organization-null.json#/environment_id
    reason: >-
      the API answers the scope of an organization-level API key with environment_id null, which
      the published spec types as a string only
    trigger: when the published spec allows null for environment_id of APIKeyScopeRead
  - key: reply update_tenant.200.null-attributes.json#/attributes
    reason: >-
      the API stores null for the attributes of a tenant that an update sets to null, and then
      returns them as null, which the published spec types as an object only
    trigger: when the published spec allows null for attributes of TenantRead
  - key: model UserRead field roles
    reason: >-
      the reply of a user holds roles, which the published spec marks deprecated, and UserRead
      leaves out, as associated_tenants holds the roles of the user in each tenant
    trigger: when the published spec drops roles from UserRead
  - key: model CheckRequest field sdk
    reason: >-
      the PDP reads the language of the SDK from the X-Permit-SDK-Language header, which every
      request of the SDK carries, so the SDK leaves out the optional sdk field of a check
    trigger: when a PDP reads the SDK of a check from its sdk field only
  - key: model CheckRequest@pdp-cloud field sdk
    reason: >-
      the PDP reads the language of the SDK from the X-Permit-SDK-Language header, which every
      request of the SDK carries, so the SDK leaves out the optional sdk field of a check
    trigger: when a PDP reads the SDK of a check from its sdk field only
  - key: model Resource@pdp-cloud field context
    reason: >-
      the PDP container reads the context of a resource, which the spec of the cloud PDP does
      not list; the cloud PDP reads the context of the check instead
    trigger: when the spec of the cloud PDP lists the context of a resource, or the SDK stops
      sending it
  - key: model User field first_name
    reason: >-
      every PDP reads first_name, the name of the field, and the PDP container also reads its alias
      firstName, which its spec lists in place of first_name, so the SDK sends first_name
    trigger: when the spec of the PDP container lists first_name
  - key: model User field firstName
    reason: >-
