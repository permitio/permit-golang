# The SDK's decision for every operation of the API specs in this directory, which
# tools/cmd/apicoverage checks against the specs and against the requests that the tests record.
# The "API coverage" section of CONTRIBUTING.md says how to classify an operation and how to run
# the report.
#
# control-plane has a row for each operation of control-plane.json. pdp has a row for each route
# of the PDP: those of pdp-container.json, pdp-cloud.json and pdp-container.extra.json, with one
# row for a route that more than one of them lists. Either may also have a row for a route that
# none of the files lists and the SDK sends. A row has these keys:
#
#   op              The operationId of the route: pdp-container.json's when it lists the route,
#                   else pdp-cloud.json's. A row that the SDK sends and no spec lists has an id
#                   of its own, and a route of pdp-container.extra.json that the SDK does not
#                   send has none.
#   route           The method and the path, as the spec writes them. ANY stands for each
#                   method that pdp-container.extra.json lists for the route.
#   stage           The spec's stage: deprecated when the spec marks the operation deprecated,
#                   else EAP when one of its tags says EAP, else GA. A route that no spec lists
#                   is GA.
#   status          covered: a public method sends it, and an offline test records the request.
#                   planned: the SDK is to send it, and no public method does yet.
#                   excluded: the SDK does not send it, for the reason that reason names.
#                   deferred: the SDK does not send it yet; reason says why, and trigger when to
#                   decide again.
#   reason          For an excluded row, a key of reasons below; for a deferred row, a sentence.
#   trigger         For a deferred row: when to decide again.
#   sdk_only        Why the SDK sends a route that no spec lists. Only a covered or planned row
#                   whose route no spec lists has it, and each such row has it.
#   stage_override  The stage the SDK treats the operation as, with the reason, when the spec
#                   marks its stage in a way that the snapshot does not keep, such as in a
#                   summary.
#
# sdk_only_params lists the query parameters that the SDK sends to an operation whose spec does
# not list them: param is a name, or a prefix followed by *.

# The reasons an excluded row may give.
reasons:
  account-admin: "Account and organization administration: organizations, members, invites, the API history, the activity log and data export, which the dashboard and the CLI cover."
  dashboard-only: "Setup forms and helpers of the dashboard: email configurations and templates, and the check of a JWKS URL."
  deprecated: "Deprecated in the spec; the SDK uses the route that replaces it, where there is one."
  eap: "In early access (EAP); the SDK adds an EAP feature once it is generally available."
  elements-session: "Routes of Permit Elements that need the session of an Elements user; an API key cannot call them."
  integration: "Routes that an API gateway or a database integration calls directly (Kong, nginx, Trino), not an application."
  operator: "Routes for whoever runs a PDP: its configuration and keys, callbacks, reloads, connectivity and health checks; an application does not call them."
  project-setup: "One-time setup of a project: policy Git repositories and the OPAL scope configuration, which the CLI and Terraform cover."
  testing-tool: "A testing tool that only selected organizations can use."

